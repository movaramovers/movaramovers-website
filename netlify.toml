[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Serve static assets directly — must come before the SSR catch-all
[[redirects]]
  from   = "/favicon.ico"
  to     = "/favicon.ico"
  status = 200
  force  = false

[[redirects]]
  from   = "/assets/*"
  to     = "/assets/:splat"
  status = 200
  force  = false

[[redirects]]
  from   = "/robots.txt"
  to     = "/robots.txt"
  status = 200
  force  = false

[[redirects]]
  from   = "/sitemap.xml"
  to     = "/sitemap.xml"
  status = 200
  force  = false

# All remaining requests handled by the Nitro SSR function
[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/server"
  status = 200
